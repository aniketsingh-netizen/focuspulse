name: Deploy FocusPulse AI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "static/**"
      - "templates/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static dashboard
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          mkdir -p site/static/js
          cp templates/index.html site/index.html
          cp static/js/dashboard.js site/static/js/dashboard.js
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          api_base_url = os.environ.get("API_BASE_URL", "").strip().rstrip("/")
          Path("site/static/js/api-config.js").write_text(
              "window.FOCUSPULSE_API_BASE = "
              + json.dumps(api_base_url)
              + ";\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
