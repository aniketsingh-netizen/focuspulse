services:
  - type: web
    name: focuspulse-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --ws-max-size 2010000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: FOCUSPULSE_ALLOWED_ORIGINS
        sync: false
